<nav
  x-data="{ isOpen: false, isScrolled: false }"
  x-init="
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          isScrolled = window.scrollY > 20;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true })
  "
  :class="isScrolled ? 'bg-surface/90 backdrop-blur-md shadow-sm' : 'bg-transparent'"
  class="fixed w-full z-50 transition-all duration-300 py-4 print:hidden"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center">
      <!-- Logo -->
      <a href="{{ .Site.BaseURL }}" class="flex items-center gap-2 group">
        <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-lg flex items-center justify-center shadow-lg shadow-primary-500/20 group-hover:scale-110 transition-transform duration-300">
          <img src="{{ .Site.Params.logo }}" alt="Logo" class="w-10 h-10 object-cover rounded-lg" width="40" height="40">
        </div>
        <span class="text-lg sm:text-xl font-bold tracking-tight" :class="isScrolled ? 'text-slate-900' : 'text-slate-800'">
          {{ index (split .Site.Title " ") 0 }}<span class="text-primary-600">{{ index (split .Site.Title " ") 1 }}</span>
        </span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-6">
        <ul class="flex gap-8">
          {{ range .Site.Menus.main }}
            <li>
              <a href="{{ .URL }}" class="text-sm font-medium text-slate-600 hover:text-primary-600 transition-colors">
                {{ .Name }}
              </a>
            </li>
          {{ end }}
        </ul>
        <!-- Search trigger -->
        <button
          type="button"
          @click="$dispatch('open-search')"
          class="flex items-center gap-2 px-3 py-1.5 text-sm text-slate-700 bg-slate-50 hover:bg-slate-200/80 rounded-xl transition-colors"
          aria-label="Search posts"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
          </svg>
          <span>Search</span>
        </button>
        <button
          type="button"
          data-theme-toggle
          onclick="window.__cycleTheme()"
          class="p-2 text-slate-600 hover:text-primary-600 bg-slate-50 hover:bg-slate-200/80 rounded-xl transition-colors"
          aria-label="Change theme"
          title="Change theme"
        >
          <svg class="w-4 h-4 hidden [[data-theme-mode=light]_&]:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="w-4 h-4 hidden [[data-theme-mode=dark]_&]:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
          <svg class="w-4 h-4 hidden [[data-theme-mode=system]_&]:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>
      </div>

      <!-- Mobile right side: search icon + menu -->
      <div class="flex items-center gap-0.5 md:hidden">
        <button
          type="button"
          data-theme-toggle
          onclick="window.__cycleTheme()"
          class="p-2.5 text-slate-600 hover:text-primary-600"
          aria-label="Change theme"
          title="Change theme"
        >
          <svg class="w-6 h-6 hidden [[data-theme-mode=light]_&]:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="w-6 h-6 hidden [[data-theme-mode=dark]_&]:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
          <svg class="w-6 h-6 hidden [[data-theme-mode=system]_&]:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>
        <button
          type="button"
          @click="$dispatch('open-search')"
          class="p-2.5 text-slate-600 hover:text-primary-600"
          aria-label="Search posts"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
          </svg>
        </button>
        <button
          class="p-2.5 text-slate-600 hover:text-primary-600"
          @click="isOpen = !isOpen"
          aria-label="Toggle menu"
        >
          <svg x-show="!isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg x-show="isOpen" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div
    x-show="isOpen"
    x-cloak
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 scale-y-95"
    x-transition:enter-end="opacity-100 scale-y-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-y-100"
    x-transition:leave-end="opacity-0 scale-y-95"
    class="md:hidden absolute top-full left-0 w-full bg-surface-raised/95 backdrop-blur-lg border-b border-slate-100 shadow-xl origin-top"
  >
    <div class="px-4 py-6">
      <ul class="flex flex-col gap-4">
        {{ range .Site.Menus.main }}
          <li>
            <a href="{{ .URL }}" class="block text-lg font-medium text-slate-800 hover:text-primary-600" @click="isOpen = false">
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  </div>
</nav>

<!-- Alpine.js for interactivity -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<!-- Search modal -->
{{ partial "search.html" . }}
